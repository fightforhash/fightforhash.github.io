---
# Access-port baseline for campus switches.
# Always dry-run first:
#   ansible-playbook -i inventory.yml interfaces.yml --check --diff
- name: Access port baseline
  hosts: switches
  gather_facts: false
  connection: network_cli

  vars:
    access_vlan: 20
    voice_vlan: 30
    access_ports:
      - GigabitEthernet0/2
      - GigabitEthernet0/3
      - GigabitEthernet0/4

  tasks:
    - name: Gather current L2 configuration
      cisco.ios.ios_facts:
        gather_subset: min
        gather_network_resources:
          - l2_interfaces

    - name: Apply data and voice VLANs
      cisco.ios.ios_l2_interfaces:
        config: >-
          {{ access_ports
             | map('community.general.dict_kv', 'name')
             | map('combine', {'access': {'vlan': access_vlan},
                               'voice':  {'vlan': voice_vlan}})
             | list }}
        state: merged

    - name: Harden the access edge
      cisco.ios.ios_config:
        parents: "interface {{ item }}"
        lines:
          - switchport mode access
          - switchport port-security maximum 2
          - switchport port-security violation restrict
          - spanning-tree portfast
          - spanning-tree bpduguard enable
      loop: "{{ access_ports }}"

    - name: Save running-config only if something changed
      cisco.ios.ios_config:
        save_when: changed
