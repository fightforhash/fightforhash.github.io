name: network-ci

# Config changes go through review like code: lint, then dry-run against
# the lab before anyone touches production gear.
on:
  pull_request:
    paths:
      - 'playbooks/**'
      - 'inventory/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tooling
        run: pip install ansible-core ansible-lint yamllint netmiko

      - name: Install collections
        run: ansible-galaxy collection install cisco.ios community.general

      - name: Lint YAML
        run: yamllint playbooks/ inventory/

      - name: Lint playbooks
        run: ansible-lint playbooks/

      - name: Dry run against the lab
        run: >-
          ansible-playbook -i inventory/lab.yml playbooks/interfaces.yml
          --check --diff
        env:
          NET_USER: ${{ secrets.NET_USER }}
          NET_PASS: ${{ secrets.NET_PASS }}
